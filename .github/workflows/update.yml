name: Update price list and deploy

# Refresh slots (Malaysia time, UTC+8). GitHub cron runs in UTC, so each slot is written as its UTC time
# and the "Check Malaysia time slot" step below makes sure it really is the intended Malaysia day and hour.
#   1st of the month  07:30  ->  23:30 UTC on the evening before (28th-31st, only the real eve passes the check)
#   2nd of the month  07:00  ->  23:00 UTC on the 1st
#   3rd of the month  07:00  ->  23:00 UTC on the 2nd
#   15th of the month 08:00  ->  00:00 UTC on the 15th
on:
  schedule:
    - cron: '30 23 28-31 * *'
    - cron: '0 23 1 * *'
    - cron: '0 23 2 * *'
    - cron: '0 0 15 * *'
  workflow_dispatch: # "Run workflow" button, to refresh on demand
  push:
    branches: [main] # redeploy when the site itself is edited (no scraping)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      scrape: ${{ steps.scrape.outcome }}
      go: ${{ steps.gate.outputs.go }}
    steps:
      - name: Check Malaysia time slot
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          D=$(TZ=Asia/Kuala_Lumpur date +%-d)
          H=$(TZ=Asia/Kuala_Lumpur date +%-H)
          go=false
          # allow up to 4 hours of GitHub scheduling delay after each slot
          case "$D" in
            1|2|3) if [ "$H" -ge 7 ] && [ "$H" -lt 11 ]; then go=true; fi ;;
            15)    if [ "$H" -ge 8 ] && [ "$H" -lt 12 ]; then go=true; fi ;;
          esac
          echo "Malaysia day=$D hour=$H -> go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.go == 'true'

      - name: Refresh prices, rebates and insurance estimates from toyota.com.my
        id: scrape
        if: steps.gate.outputs.go == 'true' && github.event_name != 'push'
        continue-on-error: true # keep the previous data for any model that failed, and still deploy
        run: node scraper/update.mjs

      - name: Commit refreshed data
        if: steps.gate.outputs.go == 'true' && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/prices.json
          git diff --cached --quiet || git commit -m "Refresh prices $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.go == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.go == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Turns the run red (GitHub emails you) when the scraper had to keep old data for some models.
  alert:
    needs: [build, deploy]
    if: needs.build.outputs.scrape == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The scraper could not refresh every model - old data was kept for those. Open the 'Refresh prices' step in the build job for details."
          exit 1
