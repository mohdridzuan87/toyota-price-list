name: Update price list and deploy

on:
  schedule:
    - cron: '0 0 1,15 * *' # 00:00 UTC = 08:00 Malaysia time, on the 1st and 15th of every month
  workflow_dispatch: # "Run workflow" button, to refresh on demand
  push:
    branches: [main] # redeploy when the site itself is edited (no scraping)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      scrape: ${{ steps.scrape.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Refresh prices, rebates and insurance estimates from toyota.com.my
        id: scrape
        if: github.event_name != 'push'
        continue-on-error: true # keep the previous data for any model that failed, and still deploy
        run: node scraper/update.mjs

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/prices.json
          git diff --cached --quiet || git commit -m "Refresh prices $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Turns the run red (GitHub emails you) when the scraper had to keep old data for some models.
  alert:
    needs: [build, deploy]
    if: needs.build.outputs.scrape == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The scraper could not refresh every model - old data was kept for those. Open the 'Refresh prices' step in the build job for details."
          exit 1
